<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Requests - Asset Management System</title>
  <link rel="stylesheet" href="src/styles/style.css">
</head>
<body>
  <div id="navbar"></div>

  <div class="container">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
      <h1>My Requests</h1>
      <button class="btn btn-primary" onclick="showRequestModal()">Request New Asset</button>
    </div>

    <div class="card">
      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th>Asset</th>
              <th>Request Date</th>
              <th>Status</th>
              <th>Return Date</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="requestsTableBody">
            <tr><td colspan="5" class="text-center">Loading...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Request Modal -->
  <div id="requestModal" class="modal-overlay hidden">
    <div class="modal-content">
      <div class="card-header">Request New Asset</div>
      <form id="requestForm">
        <div class="form-group">
          <label for="assetSelect">Select Asset</label>
          <select id="assetSelect" class="form-control" required>
            <option value="">Loading...</option>
          </select>
        </div>
        <div class="form-group">
          <label for="remarks">Remarks (Optional)</label>
          <textarea id="remarks" class="form-control" rows="3"></textarea>
        </div>
        <div style="display: flex; gap: 1rem;">
          <button type="submit" class="btn btn-primary">Submit Request</button>
          <button type="button" class="btn btn-danger" onclick="closeRequestModal()">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module" src="src/pages/my-requests.js"></script>
</body>
</html>
