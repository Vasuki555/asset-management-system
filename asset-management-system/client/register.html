<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - Asset Management System</title>
  <link rel="stylesheet" href="src/styles/style.css">
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <div class="login-header">
        <h1>Create Account</h1>
        <p>Register for Asset Management</p>
      </div>

      <div id="alert"></div>

      <form id="registerForm">
        <div class="form-group">
          <label for="name">Full Name</label>
          <input type="text" id="name" class="form-control" required>
        </div>

        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" class="form-control" required>
        </div>

        <div class="form-group">
          <label for="department">Department</label>
          <input type="text" id="department" class="form-control" required>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" class="form-control" minlength="6" required>
        </div>

        <div class="form-group">
          <label for="role">Role</label>
          <select id="role" class="form-control" required>
            <option value="user">User</option>
            <option value="admin">Admin</option>
          </select>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%;">Register</button>
      </form>

      <p class="text-center mt-2">
        Already have an account? <a href="index.html" style="color: var(--primary-color);">Login</a>
      </p>
    </div>
  </div>

  <script type="module" src="src/pages/register.js"></script>
</body>
</html>
