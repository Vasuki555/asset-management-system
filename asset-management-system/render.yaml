services:
  # Backend Service
  - type: web
    name: asset-management-backend
    env: node
    region: oregon
    plan: free
    buildCommand: cd server && npm install
    startCommand: cd server && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRE
        value: 7d
      - key: CLIENT_URL
        sync: false

  # Frontend Service
  - type: web
    name: asset-management-frontend
    env: static
    region: oregon
    plan: free
    buildCommand: cd client && npm install
    staticPublishPath: ./client
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
